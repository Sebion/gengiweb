  <script>
    $(document).ready(function () {
      var mousetimeout;
      var screensaver_active = false;
      var idletime = 30;

      function show_screensaver() {
        $('#screensaver').fadeIn();
        screensaver_active = true;
        screensaver_animation();
      }

      function stop_screensaver() {
        $('#screensaver').fadeOut();
        screensaver_active = false;
      }

      function getRandomColor() {
        var letters = '0123456789ABCDEF'.split('');
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.round(Math.random() * 15)];
        }
        return color;
      }

      // $(document).click(function () {
      //     clearTimeout(mousetimeout);
      //
      //     if (screensaver_active) {
      //         stop_screensaver();
      //     }
      //
      //     mousetimeout = setTimeout(function () {
      //         show_screensaver();
      //     }, 500 * idletime); // 5 secs
      // });

      $(document).mousemove(function () {
        clearTimeout(mousetimeout);

        if (screensaver_active) {
          stop_screensaver();
        }
        mousetimeout = setTimeout(function () {
          show_screensaver();
        }, 1000 * idletime); // 5 secs
      });

      function screensaver_animation() {
        if (screensaver_active) {
          $('#screensaver').animate(
            { backgroundColor: getRandomColor() },
            400,
            screensaver_animation);
        }
      }
    });
  </script>

  <script>
    var x = 0,
      y = 0,
      dirX = 1,
      dirY = 1;
    const speed = 2;
    let dvd = document.getElementById("dvd");
    let screensaver = document.getElementById("screensaver");
    const dvdWidth = dvd.clientWidth;
    const dvdHeight = dvd.clientHeight;

    function animate() {
      const screenHeight = screensaver.clientHeight;
      const screenWidth = screensaver.clientWidth;

      if (y + dvdHeight + 60 >= screenHeight || y < 0) {
        dirY *= -1;

      }
      if (x + dvdWidth + 500 >= screenWidth || x < 0) {
        dirX *= -1;

      }
      x += dirX * speed;
      y += dirY * speed;
      dvd.style.left = x + "px";
      dvd.style.top = y + "px";
      window.requestAnimationFrame(animate);
    }

    window.requestAnimationFrame(animate);

  </script>

  <script>
    const season1Images = [
      "fig/slideshow/IMG_1820.jpg",
      "fig/slideshow/IMG_3671.JPG",
      "fig/slideshow/IMG_3670.JPG",
      "fig/slideshow/IMG_0008fixed.jpg"
    ];

    const season2Images = [
      "fig/slideshow/IMG_6315.PNG",
      "fig/slideshow/IMG_6322.PNG",
      "fig/slideshow/IMG_6335.jpg",
      "fig/slideshow/IMG_6333.jpg"
    ];

    let currentSeason = season1Images; // Default season
    // Function to highlight the selected season
    function highlightSelectedSeason(selectedId) {
      const season1 = document.getElementById('season-1');
      const season2 = document.getElementById('season-2');

      // Reset the text content and class for both seasons
      season1.textContent = "season-1";
      season2.textContent = "season-2";
      season1.classList.remove('selected-season');
      season2.classList.remove('selected-season');

      // Add the 'selected-season' class and append '<<' to the selected season
      const selectedElement = document.getElementById(selectedId);
      selectedElement.classList.add('selected-season');
      selectedElement.textContent += " <<";
    }
    // Function to update slider images
    function updateSliderImages(images) {
      const slides = document.querySelectorAll(".slide img");
      slides.forEach((slide, index) => {
        slide.src = images[index];
      });
    }

    // Add event listeners for season selection
    document.getElementById('season-1').addEventListener('click', () => {
      currentSeason = season1Images;
      updateSliderImages(currentSeason);
      highlightSelectedSeason('season-1');

    });

    document.getElementById('season-2').addEventListener('click', () => {
      currentSeason = season2Images;
      updateSliderImages(currentSeason);
      highlightSelectedSeason('season-2');
    });

    // Initialize slider with Season 1 images
    updateSliderImages(currentSeason);
    highlightSelectedSeason('season-1');


    const slider = document.querySelector(".slider");
    const nextBtn = document.querySelector(".next-btn");
    const prevBtn = document.querySelector(".prev-btn");
    const slides = document.querySelectorAll(".slide");
    const slideIcons = document.querySelectorAll(".slide-icon");
    const numberOfSlides = slides.length;
    var slideNumber = 0;

    //image slider next button
    nextBtn.addEventListener("click", () => {
      slides.forEach((slide) => {
        slide.classList.remove("active");
      });
      slideIcons.forEach((slideIcon) => {
        slideIcon.classList.remove("active");
      });

      slideNumber++;

      if (slideNumber > (numberOfSlides - 1)) {
        slideNumber = 0;
      }

      slides[slideNumber].classList.add("active");
      slideIcons[slideNumber].classList.add("active");
    });

    //image slider previous button
    prevBtn.addEventListener("click", () => {
      slides.forEach((slide) => {
        slide.classList.remove("active");
      });
      slideIcons.forEach((slideIcon) => {
        slideIcon.classList.remove("active");
      });

      slideNumber--;

      if (slideNumber < 0) {
        slideNumber = numberOfSlides - 1;
      }

      slides[slideNumber].classList.add("active");
      slideIcons[slideNumber].classList.add("active");
    });

    //image slider autoplay
    var playSlider;

    var repeater = () => {
      playSlider = setInterval(function () {
        slides.forEach((slide) => {
          slide.classList.remove("active");
        });
        slideIcons.forEach((slideIcon) => {
          slideIcon.classList.remove("active");
        });

        slideNumber++;

        if (slideNumber > (numberOfSlides - 1)) {
          slideNumber = 0;
        }

        slides[slideNumber].classList.add("active");
        slideIcons[slideNumber].classList.add("active");
      }, 3000);
    }
    repeater();

    //stop the image slider autoplay on mouseover
    slider.addEventListener("mouseover", () => {
      clearInterval(playSlider);
    });

    //start the image slider autoplay again on mouseout
    slider.addEventListener("mouseout", () => {
      repeater();
    });
  </script>
